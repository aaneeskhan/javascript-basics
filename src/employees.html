<body>

          <div class="container bg-slate-400   mx-auto my-4">

                    <div class="py-4">
                              <label for="txtBoxId" class="px-4">Id</label>
                              <input type="text" class="border-2 px-6" value="" placeholder="Enter Id" id="txtBoxId">
                    </div>
                    <div class="py-4">
                              <label for="txtBoxName" class="px-4">Name</label>
                              <input type="text" class="border-2 px-6" placeholder="Enter Name" id="txtBoxName">
                    </div>

                    <div class="py-4">

                    <div class="py-4">

                    <div class="py-4">

                    <div class="py-4">

                                        Employee</button>
                              <button onclick="showEmployees()" class="mx-12 bg-cyan-400 px-4 py-2 rounded-2xl">Show

                    </div>


                    <div>

                                                            <td>Id</td>

                                                            <td>Gender</td>
                                                            <td>Salary</td>
                                                  </tr>

                                        </tbody>
                              </table>

          </div>

                    function getData() {

                              let num2 = document.querySelector("#txtBoxSecondNum").value
                    
                              let n1=parseInt(num1)
                              let n2=parseInt(num2)

                    }

                              let result= x+y;
                              console.log(`The sum of two numbers that is ${x} and ${y} is ${result}`);
                              subtraction(x,y,mul)
                    }

                      
                    
                    
                    
                    
                    
                    
                              // 70  5 mul

                              multiplication(x,y);
                    }

                         let  mul= (x,y)=>{
                              let result= x*y;
                              console.log(`The multiplication of two numbers that is ${x} and ${y} is ${result}`);
                    }





                    let employees = [];

                    function addEmployee() {
                              let txtBoxId = document.querySelector("#txtBoxId");
                              let empId = txtBoxId.value;

                              let txtBoxName = document.querySelector("#txtBoxName");
                              let empName = txtBoxName.value;

                              let txtBoxEmail = document.querySelector("#txtBoxEmail");
                              let empEmail = txtBoxEmail.value;

                              let ddlGender = document.querySelector("#ddlGender");
                              let empGender = ddlGender.value;

                              let txtBoxSalary = document.querySelector("#txtBoxSalary");
                              let empSalary = txtBoxSalary.value;

                              let employee = {
                                        id: empId,
                                        name: empName,
                                        email: empEmail,
                                        gender: empGender,
                                        salary: empSalary
                              }

                              employees.push(employee)
                    }


                    function showEmployees() {
                              console.log("showEmployees")
                    }

                showStudent();


                function addStudent() {
                        let rollNo1 = txtBoxRollNo.value;

                        showStudent();
                }

                function searchStudent() {

                        let searchTerm = txtBoxSearchByName.value.toLowerCase(); // IF  if
                                                                                // IFRA  ifra
                        let newStudentList = studentList.filter((student) => student.name.toLowerCase().startsWith(searchTerm))

                                showStudent();
                        }
                        else {

<body>
          <script>
                    function fullfilled(data) {
                              console.log(data)
                    }
                    function failure(err) {
                              console.log(err)
                    }

                    let prom = new Promise((fullfilled, failure) => {
                              let numerator = parseInt(prompt("Enter any numerator"));
                              let donominator = Number(prompt("Enter any denominator"));

                              let result = numerator / donominator;
                              if (donominator == 0) {
                                        failure("Something went wrong! actually donomiator is zero");
                              }
                              else {
                                        fullfilled(`Everything is cool, res=${result}`);
                              }
                    });
                    prom.then(fullfilled).catch(failure)

                    // 

          </script>
